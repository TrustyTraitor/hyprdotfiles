# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

source = ~/.config/hypr/modules/themes/mocha.conf

$font = JetBrainsMono Nerd Font Propo

general {
    hide_cursor = false
}


animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    color = $base
    blur_passes = 0
    path = ~/Pictures/wallpapers/foggy-city.jpg
    blur_passes = 3
}

label {
    monitor = DP-1
    font_family = $font
    font_size = 30

    text = Hello,

    position = -2.2%, 15%
    halign = center
    valign = center
}

label {
    monitor = DP-1
    font_family = $font
    font_size = 30

    color = $pink
    text = $USER

    position = 2.2%, 15%
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 20%, 4%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    inner_color = $mantle
    outer_color = $pink $mauve 45deg
    check_color = $mauve $lavendar 120deg
    fail_color = $red $maroon 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 50

    font_family = $font
    placeholder_text = Password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -5%
    halign = center
    valign = center
}

# Capslock indicator
label {
    monitor = DP-1
    text = cmd[update:1] awk '{print ""($0?"󰪛 Capslock is On":" "); exit}' /sys/class/leds/input*::capslock/brightness
    font_size = 15
    font_family = $font

    position = 0, -10%
    halign = center
    valign = center
}

# TIME
label {
    monitor = DP-1
    text = $TIME12 # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 120
    font_family = $font

    position = 0, 10%
    halign = center
    valign = center
}

# DATE
label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, 5% 
    halign = center
    valign = center
}

